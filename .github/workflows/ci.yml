name: Prototype CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=coverage/requirements.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-test-results
          path: coverage/requirements.xml
      - run: npm run validate
      - run: npm run golden
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
